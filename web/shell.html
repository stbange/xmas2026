<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advent of LAN</title>
<meta name="description" content="24 portals to 2001 - a retro-3D advent calendar.">
<!-- SPDX-License-Identifier: MIT -->
<style>
  :root { --bg: #0d1020; --ink: #e9ecff; --muted: #9aa3d6; --gold: #ffcc4d; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Courier New", ui-monospace, monospace; overflow: hidden; }
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
    image-rendering: pixelated; outline: none; touch-action: none; }
  #overlay { position: fixed; left: 0; right: 0; top: 0; padding: 12px 16px;
    display: flex; justify-content: space-between; gap: 12px; pointer-events: none;
    font-size: 13px; color: var(--muted); text-shadow: 1px 1px 0 #000; transition: opacity 1.5s; }
  #overlay.faded { opacity: 0; }
  #title { color: var(--gold); font-weight: bold; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="overlay"><span id="title">ADVENT OF LAN</span><span id="build">build …</span></div>
<div id="status">Booting NORTHPOLE…</div>
<script src="build-info.js"></script>
<script>
  (function () {
    var b = window.TB_BUILD || { id: "dev", version: "?" };
    document.getElementById("build").textContent = "v" + b.version + " · build " + b.id;
    if (b.playtest) document.getElementById("title").textContent = "ADVENT OF LAN · PLAYTEST";
  })();
  // URL parameters become command-line arguments (?playtest=1, ?date=YYYY-MM-DD).
  function tbArgsFromQuery(search) {
    var q = new URLSearchParams(search), args = [];
    if (q.get("playtest") === "1") args.push("--playtest");
    if (q.get("date")) args.push("--date", q.get("date"));
    if (q.get("seed")) args.push("--seed", q.get("seed"));
    return args;
  }
  var Module = {
    arguments: tbArgsFromQuery(location.search),
    canvas: document.getElementById("canvas"),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { document.getElementById("status").textContent = t || ""; },
    onRuntimeInitialized: function () {
      document.body.setAttribute("data-tb-ready", "1");
      /* The game draws its own HUD; the page header fades out. */
      setTimeout(function () { document.getElementById("overlay").classList.add("faded"); }, 5000);
    }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
